<!-- Subject: Verifikasi akun PassFlow -->
<!doctype html>
<html>
  <body style="margin:0;background:#f7f7f5;font-family:Arial,sans-serif;color:#171717;">
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="padding:32px 16px;background:#f7f7f5;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="max-width:520px;background:#ffffff;border:1px solid #e7e7e4;border-radius:16px;">
            <tr>
              <td style="padding:32px;">
                <div style="width:38px;height:38px;line-height:38px;text-align:center;border-radius:11px;background:#171717;color:#ffffff;font-size:14px;font-weight:700;">P</div>
                <p style="margin:28px 0 8px;font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#9a9a94;">PassFlow</p>
                <h1 style="margin:0;font-size:26px;line-height:1.2;font-weight:700;letter-spacing:-.03em;">Verifikasi akunmu.</h1>
                <p style="margin:14px 0 24px;font-size:14px;line-height:1.7;color:#686863;">Selesaikan verifikasi untuk mulai menggunakan akun PassFlow.</p>
                <a href="{{ .RedirectTo }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/account" style="display:inline-block;padding:12px 18px;border-radius:11px;background:#171717;color:#ffffff;text-decoration:none;font-size:14px;font-weight:700;border-bottom:3px solid #f2c94c;">Verifikasi email</a>
                <p style="margin:26px 0 0;padding-top:20px;border-top:1px solid #eeeeeb;font-size:12px;line-height:1.6;color:#9a9a94;">Abaikan email ini jika kamu tidak membuat akun PassFlow.</p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
